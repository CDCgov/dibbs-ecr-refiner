# Base configuration used by both docker-compose.override.yml and docker-compose.ci.yml

services:
  server:
    environment: &refiner-environment
      - DB_URL=postgresql://postgres@db:5432/refiner
      - DB_PASSWORD=refiner
      - SESSION_SECRET_KEY=super-secret-key
      - AUTH_PROVIDER=keycloak
      - AUTH_CLIENT_ID=refinerclient
      - AUTH_CLIENT_SECRET=5yXLmlYFPYeQh4HOsO1MvqaLHlVj5aKv
      - AUTH_ISSUER=http://localhost:8082/realms/refiner
      - AUTH_ISSUER_INTERNAL=http://auth:8082/realms/refiner
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=refiner
      - AWS_SECRET_ACCESS_KEY=refiner
      - S3_ENDPOINT_URL=http://localstack:4566
      - S3_BUCKET_CONFIG=local-config-bucket

  lambda:
    build:
      context: .
      dockerfile: Dockerfile.lambda
      # keeps the Runtime Interface Emulator that serves :9000 locally
      target: local
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        pip install --no-deps -e /var/task/packages/dibbs-ecr &&
        exec /lambda-entrypoint.sh app.lambda.lambda_function.lambda_handler
    ports:
      - "9000:8080"
    environment:
      - AWS_ACCESS_KEY_ID=refiner
      - AWS_SECRET_ACCESS_KEY=refiner
      - S3_ENDPOINT_URL=http://localstack:4566
      - S3_BUCKET_CONFIG=local-config-bucket
      - EICR_INPUT_PREFIX=eCRMessageV2/
      - REFINER_INPUT_PREFIX=RefinerInput/
      - REFINER_OUTPUT_PREFIX=RefinerOutput/
      - REFINER_COMPLETE_PREFIX=RefinerComplete/
    depends_on:
      - localstack
    volumes:
      - ./refiner/app/lambda:/var/task/app/lambda
      - ./refiner/app/core:/var/task/app/core
      - ./refiner/app/services:/var/task/app/services
      - ./refiner/app/db:/var/task/app/db
      - ./refiner/assets:/var/task/assets
      - ./refiner/packages/dibbs-ecr:/var/task/packages/dibbs-ecr

  # Run with `docker compose --profile ops run --rm ops prepare-db`
  ops:
    build:
      context: .
      dockerfile: Dockerfile.ops
    working_dir: /app
    entrypoint: ["./entrypoint.sh"]
    depends_on:
      db:
        condition: service_healthy
      localstack:
        condition: service_started
    environment:
      ENV: local
      DB_URL: postgresql://postgres@db:5432/refiner
      DB_PASSWORD: refiner
      SSL_MODE: disable
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: refiner
      AWS_SECRET_ACCESS_KEY: refiner
      S3_ENDPOINT_URL: http://localstack:4566
      S3_BUCKET_CONFIG: local-config-bucket
    profiles: ["ops"]

  db:
    image: postgres:alpine
    restart: on-failure
    user: postgres
    environment:
      - POSTGRES_DB=refiner
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=refiner
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 1s
      timeout: 5s
      retries: 10

  auth:
    image: quay.io/keycloak/keycloak:26.8.2-2
    command:
      - "start-dev"
      - "--import-realm"
      - "--http-port=8082"
      - "--hostname-strict=false"
      - "--http-enabled=true"
    ports:
      - "8082:8082"
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      # Mitigates CVE-2026-114938 (JDK Base64 intrinsic overflow). Remove once
      # the image ships a patched JDK. See keycloak/keycloak#55293.
      - JAVA_OPTS_APPEND=-XX:-UseBASE64Intrinsics
    volumes:
      - ./keycloak/exports:/opt/keycloak/data/import

  localstack:
    image: localstack/localstack:4
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - AWS_ACCESS_KEY_ID=refiner
      - AWS_SECRET_ACCESS_KEY=refiner
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./localstack/s3-init.sh:/etc/localstack/init/ready.d/s3-init.sh

  # Run with `docker compose run --rm seed`
  seed:
    image: python:3.15-slim
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir psycopg[binary] python-dotenv &&
             python refiner/ops/seeding/load_processed_data.py"
    profiles: ["seed"]
    depends_on:
      - db
    environment:
      - DB_URL=postgresql://postgres@db:5432/refiner
      - DB_PASSWORD=refiner

    volumes:
      - .:/app
