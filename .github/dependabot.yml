# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# Shared DIBBs conventions: every ecosystem runs weekly on Monday at 12:00 UTC
# (07:00/08:00 US Eastern), minor and patch version updates are grouped into one
# PR per ecosystem, majors get their own PRs, and version updates wait out a
# 5-day cooldown. Security updates are not grouped or delayed.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "12:00"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directories:
      - "/client"
      - "/docs"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "12:00"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]

  - package-ecosystem: "pip"
    directories:
      - "/refiner"
      - "/refiner/app/lambda"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "12:00"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    groups:
      python-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "12:00"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      docker-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker-compose"
    directories:
      - "/"
      - "/keycloak"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "12:00"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      docker-compose-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    ignore:
      # the calver `localstack/localstack` images (2026.x) require a pro license and exit
      # without `LOCALSTACK_AUTH_TOKEN`; stay on the `4` community line
      - dependency-name: "localstack/localstack"
        update-types: ["version-update:semver-major"]
