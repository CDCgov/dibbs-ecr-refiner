version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/client"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      majors:
        applies-to: version-updates
        update-types:
          - "major"

  - package-ecosystem: "pip"
    directories:
      - "/refiner"
      - "/refiner/app/lambda"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      majors:
        applies-to: version-updates
        update-types:
          - "major"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      majors:
        applies-to: version-updates
        update-types:
          - "major"

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    ignore:
      # the calver `localstack/localstack` images (2026.x) require a pro license and exit
      # without `LOCALSTACK_AUTH_TOKEN`; stay on the `4` community line
      - dependency-name: "localstack/localstack"
        update-types:
          - "version-update:semver-major"
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      majors:
        applies-to: version-updates
        update-types:
          - "major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      majors:
        applies-to: version-updates
        update-types:
          - "major"
