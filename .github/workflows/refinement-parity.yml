name: Refinement parity

on:
  pull_request:
    paths:
      - "refiner/packages/dibbs-ecr/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_RUNNER_VERSION: "3.14"

defaults:
  run:
    working-directory: ./refiner

jobs:
  run-refinement-parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup python ${{env.PYTHON_RUNNER_VERSION}}
        uses: actions/setup-python@v7
        with:
          python-version: ${{env.PYTHON_RUNNER_VERSION}}
          cache: pip
          cache-dependency-path: |
            refiner/requirements.txt
            refiner/dev-requirements.txt
      - name: Install dependencies
        run: python -m pip install -r dev-requirements.txt -r requirements.txt
      - name: Run refinement parity tests
        run: python -m pytest tests/parity/test_refinement_parity.py
