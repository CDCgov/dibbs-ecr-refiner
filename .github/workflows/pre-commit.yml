name: Run pre-commit on pull request

on:
  pull_request:
    branches: [main]

env:
  PYTHON_RUNNER_VERSION: "3.14"

permissions:
  contents: write

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup python ${{env.PYTHON_RUNNER_VERSION}}
        uses: actions/setup-python@v7
        with:
          python-version: ${{env.PYTHON_RUNNER_VERSION}}
          cache: pip

      # the ruff hooks run `refiner/.venv/bin/ruff`, so mirror the local layout
      - name: Install ruff into the refiner venv
        run: |
          python -m venv refiner/.venv
          refiner/.venv/bin/pip install $(grep "^ruff==" refiner/dev-requirements.txt)

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
        continue-on-error: true

      - name: Commit changes onto PR
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "style: auto-fix pre-commit issues"
