name: Run type checking

on:
  workflow_call:
  workflow_dispatch:

env:
  PYTHON_RUNNER_VERSION: "3.14"

permissions:
  contents: read

defaults:
  run:
    working-directory: ./refiner

jobs:
  run-python-type-checker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup python ${{env.PYTHON_RUNNER_VERSION}}
        uses: actions/setup-python@v7
        with:
          python-version: ${{env.PYTHON_RUNNER_VERSION}}
          cache: pip
      - name: Install dependencies
        run: |
          pip install -U pip
          pip install -r dev-requirements.txt -r requirements.txt -r app/lambda/dev-requirements.txt
      - name: Run mypy
        run: |
          mypy
  run-ts-type-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        working-directory: ./client
        run: |
          npm ci
      # `tsc` alone checks nothing here: client/tsconfig.json is solution-style
      # (`files: []` plus `references`), and plain tsc does not follow project
      # references. `npm run check` is `tsc -b --noEmit`, which does.
      - name: Client type check
        working-directory: ./client
        run: |
          npm run check
