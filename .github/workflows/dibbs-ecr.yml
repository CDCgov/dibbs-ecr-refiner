name: Check dibbs-ecr

on:
  pull_request:
    paths:
      - "refiner/packages/dibbs-ecr/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_RUNNER_VERSION: "3.14"

defaults:
  run:
    working-directory: ./refiner/packages/dibbs-ecr

jobs:
  check-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup python ${{env.PYTHON_RUNNER_VERSION}}
        uses: actions/setup-python@v7
        with:
          python-version: ${{env.PYTHON_RUNNER_VERSION}}
          cache: pip
          cache-dependency-path: |
            refiner/packages/dibbs-ecr/pyproject.toml
            refiner/packages/dibbs-ecr/dev-requirements.txt
      - name: Install package and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r dev-requirements.txt .
      - name: Test regular installation
        run: python -m pytest
      - name: Check package lint and formatting
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Check package types
        run: python -m mypy --config-file pyproject.toml
