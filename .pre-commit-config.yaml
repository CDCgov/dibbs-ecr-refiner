# pre-commit configuration
default_language_version:
  python: python3.14

repos:
  # core formatting and check hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # - prevent large file commits
      - id: check-added-large-files
        args:
          # 30mb == 35,840kb
          - --maxkb=35840
      # - validate toml syntax
      - id: check-toml
      # - validate yaml syntax
      - id: check-yaml
        args:
          - --unsafe
      # - ensure files end with newline
      - id: end-of-file-fixer
        # * source-ersd/ holds eRSD releases byte-for-byte as served; normalize
        #   records their hashes, so any rewrite fails verify-processed
        exclude: |
          (?x)^(
            refiner/openapi\.json|
            client/src/api/|
            refiner/tes/data/source-ersd/ersd_.+\.json
          )$
      # - remove trailing whitespace
      - id: trailing-whitespace
        exclude: |
          (?x)^(
            refiner/openapi\.json|
            client/src/api/|
            refiner/tests/integration/scenarios/snapshots/.+/.+\.xml|
            refiner/tes/data/source-ersd/ersd_.+\.json
          )$

  # ruff linting and formatting
  # - runs the refiner venv's ruff so `refiner/dev-requirements.txt` is the only
  #   place the version is pinned; CI's lint job and Dependabot both read it there
  - repo: local
    hooks:
      # - run the linter with auto-fixes
      - id: ruff-check
        name: ruff check
        entry: refiner/.venv/bin/ruff check --force-exclude --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      # - run the formatter; ruff 0.16+ also formats python blocks in markdown
      - id: ruff-format
        name: ruff format
        entry: refiner/.venv/bin/ruff format --force-exclude
        language: system
        types_or: [python, pyi, markdown]
        # * ruff only recognizes lowercase `.md`; an explicitly passed `.MD` file
        #   is parsed as python and fails
        exclude: \.MD$
        require_serial: true

  # tsx formatting only
  # PERF: Linting can take about 5 seconds to complete so should be done
  # manually.
  - repo: local
    hooks:
      - id: tsx-format
        name: Format TSX files
        entry: just client::run fmt
        language: system
        files: \.tsx$
        pass_filenames: false

# CI configuration
ci:
  autofix_commit_msg: 🎨 [pre-commit.ci] Auto format from pre-commit.com hooks
  autoupdate_commit_msg: ⬆ [pre-commit.ci] pre-commit autoupdate
